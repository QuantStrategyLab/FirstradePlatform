name: FT AFS grant deploy secret access

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: firstradequant
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1088907247379/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: firstrade-platform-deploy@firstradequant.iam.gserviceaccount.com

concurrency:
  group: ft-afs-grant-deploy-secret-access
  cancel-in-progress: false

jobs:
  grant:
    name: Grant deploy SA accessor on AFS sync token secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      SECRET_NAME: ${{ vars.FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN_SECRET_NAME }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Bind secretAccessor for deploy SA
        run: |
          set -euo pipefail
          if [ -z "${SECRET_NAME:-}" ]; then
            echo "FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN_SECRET_NAME is empty" >&2
            exit 1
          fi
          echo "secret_name=${SECRET_NAME}"
          echo "member=serviceAccount:${GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT}"
          # Describe without reading payload
          gcloud secrets describe "${SECRET_NAME}" --project="${GCP_PROJECT_ID}" --format='yaml(name,createTime,replication)' 
          gcloud secrets add-iam-policy-binding "${SECRET_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --member="serviceAccount:${GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT}" \
            --role="roles/secretmanager.secretAccessor" \
            --condition=None
          echo "binding_ok=true"
          # Verify access works without printing the secret value
          len="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${SECRET_NAME}" | wc -c | tr -d ' ')"
          echo "sync_token_byte_length=${len}"
          if [ "${len}" = "0" ]; then
            echo "secret payload empty" >&2
            exit 1
          fi
