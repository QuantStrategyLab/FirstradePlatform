name: FT AFS auth diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: firstradequant
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1088907247379/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: firstrade-platform-deploy@firstradequant.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_SCHEDULER_LOCATION: ${{ vars.CLOUD_SCHEDULER_LOCATION || vars.CLOUD_RUN_REGION || 'us-central1' }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Compare probe vs account-facts scheduler and IAM
        run: |
          set -euo pipefail
          svc="${CLOUD_RUN_SERVICE}"
          loc="${CLOUD_SCHEDULER_LOCATION}"
          echo "=== IAM ==="
          gcloud run services get-iam-policy "${svc}" --region="${CLOUD_RUN_REGION}" --format=json \
            | python3 -c 'import json,sys; p=json.load(sys.stdin);
print("bindings:");
[print(b.get("role"), sorted(b.get("members") or [])) for b in (p.get("bindings") or [])]'
          for job in ("${svc}-probe-scheduler" "${svc}-account-facts-sync-scheduler"); do
            echo "=== JOB ${job} ==="
            gcloud scheduler jobs describe "${job}" --location="${loc}" --format=json \
              | python3 -c 'import json,sys; j=json.load(sys.stdin); ht=j.get("httpTarget") or {}; oidc=ht.get("oidcToken") or {};
print("state", j.get("state"));
print("uri", ht.get("uri"));
print("method", ht.get("httpMethod"));
print("sa", oidc.get("serviceAccountEmail"));
print("audience", oidc.get("audience"));
print("lastAttempt", j.get("lastAttemptTime"));
print("status", j.get("status"));'
          done
          echo "=== recent AFS request logs ==="
          filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${svc}\" AND timestamp>=\"2026-10-09T06:45:00Z\" AND httpRequest.requestUrl:\"/account-facts-sync\""
          gcloud logging read "${filter}" --limit=20 --format=json \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); print("count",len(rows));
[print(r.get("timestamp"), (r.get("httpRequest") or {}).get("status"), (r.get("httpRequest") or {}).get("latency"), (r.get("httpRequest") or {}).get("userAgent"), (r.get("textPayload") or "")[:200]) for r in rows]'
