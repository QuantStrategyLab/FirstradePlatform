name: FT adopt facts revision

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA that must label the revision being adopted
        required: true
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: firstradequant
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1088907247379/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: firstrade-platform-deploy@firstradequant.iam.gserviceaccount.com

concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  adopt:
    name: Adopt zero-traffic facts revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
      EXECUTION_EVIDENCE_SYNC_URL: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
      APPROVED_ACCOUNT_FACTS_SYNC_URL: ${{ vars.FIRSTRADE_ACCOUNT_FACTS_SYNC_URL }}
    steps:
      - name: Validate source
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha invalid" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Dispatch must be from main (WIF)." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Adopt latestCreated revision when facts-ready
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region="${CLOUD_RUN_REGION}" --format=json)"
          revision="$(SERVICE_JSON="${service_json}" python3 - <<'PY'
          import json, os
          status=(json.loads(os.environ["SERVICE_JSON"]).get("status") or {})
          print(status.get("latestCreatedRevisionName") or "")
          PY
          )"
          if [ -z "${revision}" ]; then
            echo "latestCreatedRevisionName missing" >&2
            exit 1
          fi
          rev_json="$(gcloud run revisions describe "${revision}" --region="${CLOUD_RUN_REGION}" --format=json)"
          REVISION_JSON="${rev_json}" EXPECTED_SHA="${EXPECTED_SHA}" python3 - <<'PY'
          import json, os, re, sys
          from urllib.parse import urlsplit
          rev=json.loads(os.environ["REVISION_JSON"])
          expected=os.environ["EXPECTED_SHA"]
          labels=((rev.get("metadata") or {}).get("labels") or {})
          if labels.get("commit-sha") != expected:
              print(f"revision_source_mismatch commit={labels.get('commit-sha')}", file=sys.stderr)
              sys.exit(1)
          env_rows=((((rev.get("spec") or {}).get("containers") or [{}])[0]).get("env") or [])
          values={row.get("name"): row for row in env_rows if isinstance(row, dict)}

          def has_secret_ref(row):
              if not isinstance(row, dict):
                  return False
              for key in ("valueSource", "valueFrom"):
                  src=row.get(key)
                  if isinstance(src, dict) and isinstance(src.get("secretKeyRef"), dict):
                      secret=src["secretKeyRef"].get("name") or src["secretKeyRef"].get("secret")
                      if isinstance(secret, str) and secret.strip():
                          return True
              return False

          def has_value_or_secret(row):
              return bool((row or {}).get("value")) or has_secret_ref(row or {})

          host_re = re.compile(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\Z", re.ASCII)

          def resolve_origin(raw, allowed_paths):
              if not raw or raw != raw.strip() or any(ord(c) < 0x20 or ord(c) == 0x7F for c in raw):
                  return None
              try:
                  parsed = urlsplit(raw)
                  port = parsed.port
              except ValueError:
                  return None
              host = parsed.hostname or ""
              if (
                  parsed.scheme != "https"
                  or not host
                  or parsed.netloc != host
                  or parsed.username is not None
                  or parsed.password is not None
                  or port is not None
                  or parsed.path not in allowed_paths
                  or parsed.query
                  or parsed.fragment
                  or host_re.fullmatch(host) is None
              ):
                  return None
              return f"https://{host}"

          raw_origin = os.environ.get("QSL_CONSOLE_BASE_URL") or ""
          if raw_origin:
              expected_origin = resolve_origin(raw_origin, {""})
          else:
              expected_origin = resolve_origin(
                  os.environ.get("EXECUTION_EVIDENCE_SYNC_URL") or "",
                  {"", "/", "/api/execution-evidence/sync"},
              )
          if not expected_origin:
              print("approved_origin_invalid", file=sys.stderr); sys.exit(1)
          expected_url = f"{expected_origin}/api/account-facts/sync"
          if (os.environ.get("APPROVED_ACCOUNT_FACTS_SYNC_URL") or "") != expected_url:
              print("approved_sync_url_invalid", file=sys.stderr); sys.exit(1)

          enabled=(values.get("FIRSTRADE_ACCOUNT_FACTS_SYNC_ENABLED") or {}).get("value")
          url=(values.get("FIRSTRADE_ACCOUNT_FACTS_SYNC_URL") or {}).get("value")
          console_origin=(values.get("QSL_CONSOLE_BASE_URL") or {}).get("value")
          token=values.get("FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN")
          needed=["FIRSTRADE_ACCOUNT_FACTS_TARGET_ID","FIRSTRADE_ACCOUNT_FACTS_SOURCE_BINDING_ID","FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_KEY","FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_SCOPE"]
          if enabled != "true":
              print(f"sync_not_enabled value={enabled!r}", file=sys.stderr); sys.exit(1)
          if url != expected_url:
              print("sync_url_invalid", file=sys.stderr); sys.exit(1)
          if console_origin != expected_origin:
              print("console_origin_invalid", file=sys.stderr); sys.exit(1)
          if not has_secret_ref(token):
              keys=sorted((token or {}).keys())
              print(f"sync_token_missing keys={keys}", file=sys.stderr); sys.exit(1)
          for name in needed:
              if not has_value_or_secret(values.get(name)):
                  print(f"binding_missing {name}", file=sys.stderr); sys.exit(1)
          print("candidate_ok")
          PY
          echo "Adopting revision ${revision} to 100% traffic."
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --region="${CLOUD_RUN_REGION}" \
            --to-revisions="${revision}=100" \
            --quiet
          after="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region="${CLOUD_RUN_REGION}" --format=json)"
          AFTER_JSON="${after}" EXPECTED_REVISION="${revision}" python3 - <<'PY'
          import json, os, sys
          status=(json.loads(os.environ["AFTER_JSON"]).get("status") or {})
          expected=os.environ["EXPECTED_REVISION"]
          active=[row for row in (status.get("traffic") or []) if int(row.get("percent") or 0) > 0]
          if len(active) != 1 or active[0].get("revisionName") != expected or int(active[0].get("percent") or 0) != 100:
              print(f"traffic_adopt_failed active={active}", file=sys.stderr)
              sys.exit(1)
          print(f"traffic_adopted revision={expected} percent=100")
          PY
