name: Publish one Firstrade runtime daily projection

on:
  workflow_dispatch:
    inputs:
      compare_nonce:
        description: Optional 64-hex nonce for protected source comparison only
        type: string
        required: false
      preflight_only:
        description: Check authentication only; do not read or publish reports
        type: boolean
        default: true
      business_date:
        description: One New York business date (YYYY-MM-DD), required for publication
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firstrade-runtime-daily-once
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: firstradequant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1088907247379/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: firstrade-platform-deploy@firstradequant.iam.gserviceaccount.com
      RUNTIME_HEARTBEAT_REPORT_PLATFORM: firstrade
      FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_KEY: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_ACCOUNT_KEY }}
      FIRSTRADE_ACCOUNT_FACTS_SOURCE_BINDING_ID: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_SOURCE_BINDING_ID }}
      EXECUTION_REPORT_GCS_URI: ${{ vars.EXECUTION_REPORT_GCS_URI || secrets.EXECUTION_REPORT_GCS_URI }}
      EXECUTION_EVIDENCE_SYNC_URL: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
      EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      FIRSTRADE_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_TARGET_ID }}
      RUNTIME_DAILY_COMPARE_NONCE: ${{ inputs.compare_nonce }}
      RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      RUNTIME_DAILY_BUSINESS_DATE: ${{ inputs.business_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked dependencies
        run: uv sync --frozen --no-dev
      - name: Authenticate existing report reader
        if: ${{ inputs.compare_nonce != '' || !inputs.preflight_only }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: ${{ inputs.compare_nonce != '' || !inputs.preflight_only }}
      - name: Compare protected source without publication
        if: ${{ inputs.compare_nonce != '' }}
        run: PYTHONPATH=. uv run --no-sync python -m scripts.compare_daily_source
      - name: Check existing receiver authentication without data writes
        if: ${{ inputs.compare_nonce == '' && inputs.preflight_only }}
        run: PYTHONPATH=. uv run --no-sync python -m scripts.publish_runtime_daily --preflight
      - name: Publish one protected projection
        if: ${{ inputs.compare_nonce == '' && !inputs.preflight_only }}
        run: PYTHONPATH=. uv run --no-sync python -m scripts.publish_runtime_daily
