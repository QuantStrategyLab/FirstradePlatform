name: Dot review collect

on:
  workflow_dispatch:
    inputs:
      locator_comment_id:
        description: Original bot intent comment ID (also supports unknown POST recovery)
        required: true
        type: string
      task_id:
        description: Expected task ID, if known
        type: string

permissions: {}
concurrency:
  group: dot-review-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DOT_REVIEW_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    env:
      TRUSTED_SHA: ${{ github.workflow_sha }}
      AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
      AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
    steps:
      - name: Load trusted default-branch code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Read the original task and update its draft record
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 0
          script: |
            try { await require('./.github/dot-review/review.cjs').collect({github,context,core}); }
            catch { core.setFailed('Collection failed closed; no approval or passing evidence published.'); }
      - name: Save result record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: dot-review/result.json
          retention-days: 30
          if-no-files-found: ignore
