name: Inspect cached account history schema
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: First closed UTC date, at most 31 dates per page
        type: string
        required: true
      to_date:
        description: Last closed UTC date
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.ACCOUNT_HISTORY_GCP_PROJECT_ID }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ACCOUNT_HISTORY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.ACCOUNT_HISTORY_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install the existing pinned broker SDK
        run: python -m pip install --disable-pip-version-check --quiet firstrade==0.0.39
      - name: Inspect one cached-only history page without exporting values
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: python -m scripts.inspect_account_history_schema --from-date "$FROM_DATE" --to-date "$TO_DATE"
