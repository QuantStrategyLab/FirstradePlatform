name: FT account-facts sync once

# Supported path: reuse Invoke Cloud Run → Cloud Scheduler OIDC + app Authorization
# against /account-facts-sync. The previous Cloud Run Job self-POST path returned
# gateway HTML 404 (run 37898342496) and is retired.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ft-account-facts-sync-once
  cancel-in-progress: false

jobs:
  sync:
    name: Sync account facts via Invoke Cloud Run
    uses: ./.github/workflows/invoke-cloud-run.yml
    with:
      path: /account-facts-sync
      allow_live_execution: false
    secrets: inherit
