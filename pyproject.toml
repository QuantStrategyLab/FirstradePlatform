[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.38",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@663e80be60b0da80e81513b711c579d221a2111d",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@4d5cd0f5dc389edebc648028202fd116934ca325",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
