[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.38",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@705667fbb88b743eb83e858b1cc42fe9ebc3a87a",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@aca4e1449e9e87e0222b8a1a5e0dd84f822d516c",
  "google-cloud-storage",
  "requests",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
