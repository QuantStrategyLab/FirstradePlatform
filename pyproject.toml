[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.39",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@0e8c734142d2a949f8c84d039537864d354998da",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@1f0e828685e7f281b566443aca895b932f2e2c4e",
  "google-cloud-storage",
  "requests",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
