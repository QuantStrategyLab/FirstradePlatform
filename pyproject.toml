[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.3.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "firstrade==0.0.39",
    "flask",
    "google-auth",
    "google-cloud-storage",
    "gunicorn",
    "pandas_market_calendars",
    "pytz",
    "requests",
    "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@00168a617d45205f6f685090a4197592995935b3",
    "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@c31f28484b8489a1ecda8e595a6d2afd3bce8185",
]
license = "MIT"
authors = [
  { name = "QuantStrategyLab" }
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  ".",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["E701", "E702", "E741", "F841", "F821", "B008", "F401", "F601", "E402", "E401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841"]


[tool.coverage.run]
branch = true
source = ["src/firstrade_platform"]
omit = ["tests/*", "*/external/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@00168a617d45205f6f685090a4197592995935b3",
]
