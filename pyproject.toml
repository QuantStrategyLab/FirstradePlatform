[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.39",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@b846c9d777a450e95d23c264853997d671f47dd9",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@d08492ea4b4055515606ae386e59a31a943a7fec",
  "google-cloud-storage",
  "requests",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
