[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.38",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@8e87e70d49487bc6d96587d5f9e9850727e9817b",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@fe9cc27b608ab18592b338519a5b0826f73e9a80",
  "google-cloud-storage",
  "requests",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
