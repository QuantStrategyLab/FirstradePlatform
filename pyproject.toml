[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrade-platform"
version = "0.1.0"
description = "Experimental QuantStrategyLab platform layer for Firstrade through an unofficial API wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QuantStrategyLab" }
]
dependencies = [
  "firstrade==0.0.38",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@4305a3c01151ced7e78b39519959444309326cd7",
  "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@03e23c5d6a620ca9ecb763550452f9ca3870481a",
  "google-cloud-storage",
  "requests",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "../QuantPlatformKit/src",
  "../UsEquityStrategies/src",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
